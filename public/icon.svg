<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>GovSim</title>
  <defs>
    <linearGradient id="govsim-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="govsim-main" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="govsim-prism" x1="160" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <radialGradient id="govsim-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Obsidian & Brand-Tinted Squircle Chassis -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0a0a0d" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#govsim-bg)" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#govsim-main)" stroke-width="16" stroke-opacity="0.95" />

  <!-- Radial Core Glow -->
  <circle cx="256" cy="256" r="216" fill="url(#govsim-glow)" />

  <!-- Semiotic Viewfinder Corner Brackets -->
  <path d="M86 134V102C86 93.163 93.163 86 102 86H134" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M378 86H410C418.837 86 426 93.163 426 102V134" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M86 378V410C86 418.837 93.163 426 102 426H134" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M378 426H410C418.837 426 426 418.837 426 410V378" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />

  <!-- Multi-Layer Bespoke Semiotic Geometry (1.06x Optical Presence Scale) -->
  <g transform="translate(256 256) scale(1.06) translate(-256 -256)">
    <line x1="128" y1="380" x2="384" y2="380" stroke="url(#govsim-main)" stroke-width="12" stroke-linecap="round" opacity="0.42" />
    <rect x="152" y="236" width="24" height="104" rx="6" fill="url(#govsim-main)" />
    <rect x="213" y="236" width="24" height="104" rx="6" fill="url(#govsim-main)" />
    <rect x="275" y="236" width="24" height="104" rx="6" fill="url(#govsim-main)" />
    <rect x="336" y="236" width="24" height="104" rx="6" fill="url(#govsim-main)" />
    <line x1="140" y1="352" x2="372" y2="352" stroke="url(#govsim-main)" stroke-width="22" stroke-linecap="round" />
    <line x1="256" y1="114" x2="256" y2="152" stroke="url(#govsim-prism)" stroke-width="20" stroke-linecap="round" />
    <circle cx="256" cy="220" r="84" fill="url(#govsim-prism)" />
    <rect x="144" y="208" width="224" height="32" rx="8" fill="url(#govsim-prism)" />
    <circle cx="256" cy="184" r="22" fill="#1d4ed8" />
    <circle cx="256" cy="118" r="9" fill="#ffffff" />
  </g>
</svg>
